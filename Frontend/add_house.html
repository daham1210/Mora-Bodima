<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Boarding House - MoraBodima</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
    <div id="navLinks"></div>
  
    <div id="alertBox"></div>

    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 600px; width: 100%;">
            <h2>Publish New Boarding House</h2>
            <p>Fill out the details below to list your boarding property.</p>

            <form action="../backend/add_house_process.php" method="POST" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="title">Boarding House Title</label>
                    <input type="text" id="title" name="title" required placeholder="e.g., Devi Boarding House">
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" required placeholder="e.g., 45/2, Katubedda Road, Moratuwa">
                </div>

                <div class="form-group">
                    <label for="google_maps_link">Google Maps Location Link</label>
                    <input type="url" id="google_maps_link" name="google_maps_link" placeholder="https://maps.google.com/...">
                </div>

                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="distance_km">Distance from Uni (km)</label>
                        <input type="number" step="0.1" id="distance_km" name="distance_km" required placeholder="1.2">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="monthly_rent">Monthly Rent (Rs.)</label>
                        <input type="number" id="monthly_rent" name="monthly_rent" required placeholder="15000">
                    </div>
                </div>

                <div class="form-group">
                    <label for="gender_type">Preferred Gender / Tenant Type</label>
                    <select id="gender_type" name="gender_type" required>
                        <option value="">Select Gender Type</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                     
                    </select>
                </div>

                <div class="form-group">
                    <label>Amenities (Select all that apply)</label>
                    <div class="checkbox-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 5px;">
                        <label><input type="checkbox" name="amenities[]" value="WiFi"> WiFi</label>
                        <label><input type="checkbox" name="amenities[]" value="Attached Bathroom"> Attached Bathroom</label>
                        <label><input type="checkbox" name="amenities[]" value="AC"> AC</label>
                        <label><input type="checkbox" name="amenities[]" value="Parking"> Parking</label>
                        <label><input type="checkbox" name="amenities[]" value="Furnished"> Furnished</label>
                        <label><input type="checkbox" name="amenities[]" value="Kitchen"> Kitchen</label>
                        <label><input type="checkbox" name="amenities[]" value="Hot Water"> Hot Water</label>
                        <label><input type="checkbox" name="amenities[]" value="CCTV"> CCTV</label>
                        <label><input type="checkbox" name="amenities[]" value="Laundry"> Laundry</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" placeholder="Provide additional details about rules, facilities, and environment..."></textarea>
                </div>

                <div class="form-group">
                    <label for="image">Room / Property Photo</label>
                    <input type="file" id="image" name="image" accept="image/*" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px;">Publish Listing</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
