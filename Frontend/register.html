<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MoraBodima</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="main-container auth-wrapper">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join MoraBodima to find, post, and rate boardings</p>

            <div id="alertBox"></div>

            <form action="../backend/login.php" method="POST">
                <input type="hidden" name="action" value="register">

                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" required placeholder="e.g., Kasun Silva">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="role">Account Type</label>
                    <select id="role" name="role">
                        <option value="student">University Student (Find & Rate Boardings)</option>
                        <option value="owner">Boarding Owner (Post & Manage Listings)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="4" placeholder="••••••••">
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 4px;">Create Account</button>
            </form>

            <hr class="divider">

            <p class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
            <a href="index.html" class="back-home">&larr; Back to Home</a>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
