<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MoraBodima</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="../Uploads/logo.png" alt="MoraBodima Logo" class="logo-img" onerror="this.style.display='none'">
                <span>MoraBodima</span>
            </a>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>

    <main class="main-container">
        <div id="alertBox"></div>
        <div id="profileContainer">
            <p style="text-align: center; color: #cbd5e1; padding: 40px;">Loading your profile...</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 MoraBodima — Boarding House Rating & Review System</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const profileContainer = document.getElementById('profileContainer');
            if (profileContainer) {
                fetch('../backend/profile_process.php')
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.text();
                    })
                    .then(html => {
                        profileContainer.innerHTML = html;
                    })
                    .catch(err => {
                        profileContainer.innerHTML = '<div class="alert alert-error">Could not load ../backend/profile_process.php (' + err.message + '). Make sure profile_process.php is saved inside the backend folder.</div>';
                    });
            }
        });
    </script>
</body>
</html>
