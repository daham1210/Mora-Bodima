<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MoraBodima</title>
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>
    <main class="main-container auth-wrapper">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to rate and review boarding houses</p>

            <div id="alertBox"></div>

            <form action="../backend/login.php" method="POST">
                <input type="hidden" name="action" value="login">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link" onclick="alert('Please contact admin@uni.lk to reset your password.'); return false;">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 4px;">Sign In</button>
            </form>

            <hr class="divider">

            <p class="auth-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </p>
            <a href="index.html" class="back-home">&larr; Back to Home</a>
        </div>
    </main>

    <script src="Js/app.js"></script>
</body>
</html>
